<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Alarm Bell Ears -->
  <path d="M120 130 C120 70, 180 70, 200 110" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" fill="none" />
  <path d="M392 130 C392 70, 332 70, 312 110" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" fill="none" />
  <!-- Clock Body -->
  <circle cx="256" cy="276" r="160" fill="#0f172a" stroke="url(#neonGrad)" stroke-width="16" filter="url(#glow)" />
  <circle cx="256" cy="276" r="140" fill="#090d16" />
  <!-- Clock Ticks -->
  <line x1="256" y1="156" x2="256" y2="176" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <line x1="376" y1="276" x2="356" y2="276" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="376" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <line x1="136" y1="276" x2="156" y2="276" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
  <!-- Clock Hands -->
  <line x1="256" y1="276" x2="256" y2="190" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="276" x2="330" y2="276" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="276" r="14" fill="#6366f1" />
  <!-- Feet -->
  <line x1="166" y1="416" x2="136" y2="456" stroke="url(#neonGrad)" stroke-width="16" stroke-linecap="round" />
  <line x1="346" y1="416" x2="376" y2="456" stroke="url(#neonGrad)" stroke-width="16" stroke-linecap="round" />
</svg>
